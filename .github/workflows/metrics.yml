name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Full dashboard (lowlighter-style profile metrics) ──
      - name: GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          # Prefer PAT in repo secret METRICS_TOKEN (no scopes required for most plugins).
          # Falls back to GITHUB_TOKEN so the first run can still commit SVGs.
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: rparit-stacks
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Kolkata

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_topics: yes
          plugin_topics_limit: 24
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 12

          plugin_stargazers: yes
          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_filter: all

          plugin_lines: yes

      # ── LeetCode (rparit-stacks) ──
      - name: LeetCode metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.leetcode.svg
          token: NOT_NEEDED
          user: rparit-stacks
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: rparit-stacks
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 10
          plugin_leetcode_limit_recent: 4

      # ── Portfolio PageSpeed ──
      - name: PageSpeed metrics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.plugin.pagespeed.svg
          token: NOT_NEEDED
          user: rparit-stacks
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://rohit-parit-portfolio.codvertex.in/
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
